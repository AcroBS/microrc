name: Build Android APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Test & Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare debug keystore and environment
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi
          chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit and Robolectric tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build installable debug APK
        run: |
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/MicroRC-debug.apk

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MicroRC-debug-apk-${{ github.run_number }}
          path: app/build/outputs/apk/debug/MicroRC-debug.apk
          retention-days: 30

      - name: Build signed Release APK (if secrets configured)
        if: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' && secrets.STORE_PASSWORD != '' && secrets.KEY_PASSWORD != '' }}
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "$KEYSTORE_PATH"
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/MicroRC-release.apk

      - name: Upload Release APK artifact (if built)
        if: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' && secrets.STORE_PASSWORD != '' && secrets.KEY_PASSWORD != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: MicroRC-release-apk-${{ github.run_number }}
          path: app/build/outputs/apk/release/MicroRC-release.apk
          retention-days: 30

      - name: Attach APK to GitHub Release on tag push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/MicroRC-debug.apk
            app/build/outputs/apk/release/MicroRC-release.apk
          fail_on_unmatched_files: false
