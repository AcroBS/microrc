name: Build Android APK

on:
  push:
    branches-ignore:
      - ci-keystore
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build & Test Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK licenses & install SDK 36.1
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER=""
          for candidate in \
            "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK_ROOT/cmdline-tools/bin/sdkmanager" \
            "$(command -v sdkmanager 2>/dev/null || true)"; do
            if [ -n "$candidate" ] && [ -x "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi
          done
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-36.1" "build-tools;36.0.0" "platform-tools" || \
              "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-36" "build-tools;36.0.0" "platform-tools" || true
          fi

      - name: Prepare persistent APK signing keystore and environment
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          rm -f debug.keystore

          validate_keystore() {
            if [ -s debug.keystore ] && keytool -list -keystore debug.keystore -storepass android -alias androiddebugkey >/dev/null 2>&1; then
              return 0
            fi
            rm -f debug.keystore
            return 1
          }

          # 1. Prefer user-configured GitHub Actions secret SIGNING_KEYSTORE_BASE64 if provided
          if [ -n "${SIGNING_KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$SIGNING_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > debug.keystore || rm -f debug.keystore
            validate_keystore && echo "Using keystore from SIGNING_KEYSTORE_BASE64 secret." || true
          fi

          # 2. Otherwise restore the persistent CI keystore from orphan branch 'ci-keystore'
          if [ ! -s debug.keystore ] && [ -n "${GH_TOKEN:-}" ]; then
            if gh api "repos/${GITHUB_REPOSITORY}/contents/debug.keystore.base64?ref=ci-keystore" --jq '.content' 2>/dev/null \
              | tr -d '[:space:]' | base64 -d > debug.keystore 2>/dev/null; then
              validate_keystore && echo "Restored persistent keystore via GitHub API (ci-keystore)." || true
            else
              rm -f debug.keystore
            fi
          fi

          if [ ! -s debug.keystore ]; then
            if git fetch --depth=1 origin refs/heads/ci-keystore:refs/remotes/origin/ci-keystore 2>/dev/null; then
              git show refs/remotes/origin/ci-keystore:debug.keystore.base64 | tr -d '[:space:]' | base64 -d > debug.keystore || rm -f debug.keystore
              validate_keystore && echo "Restored persistent keystore via git fetch (ci-keystore)." || true
            fi
          fi

          # 3. Otherwise use debug.keystore.base64 if present in the repository
          if [ ! -s debug.keystore ] && [ -s debug.keystore.base64 ]; then
            tr -d '[:space:]' < debug.keystore.base64 | base64 -d > debug.keystore || rm -f debug.keystore
            validate_keystore && echo "Using repository debug.keystore.base64." || true
          fi

          # 4. Very first CI run fallback: generate once and persist to 'ci-keystore' branch
          if [ ! -s debug.keystore ]; then
            echo "No existing persistent keystore found; generating new persistent CI keystore..."
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            if [ "${GITHUB_EVENT_NAME:-}" != "pull_request" ] && [ -n "${GH_TOKEN:-}" ]; then
              TMP_KS_DIR="$(mktemp -d)"
              base64 -w 0 debug.keystore > "$TMP_KS_DIR/debug.keystore.base64"
              (
                cd "$TMP_KS_DIR"
                git init -q
                git config user.name "github-actions[bot]"
                git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                git add debug.keystore.base64
                git commit -q -m "chore: persist CI APK signing keystore"
                git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" +HEAD:refs/heads/ci-keystore
              ) && echo "Saved persistent keystore to branch 'ci-keystore'." || echo "::warning::Failed to push persistent keystore to 'ci-keystore' branch."
              rm -rf "$TMP_KS_DIR"
            fi
          fi

          echo "Active APK signing certificate fingerprints:"
          CERT_INFO="$(keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey 2>/dev/null || true)"
          ACTIVE_SHA1="$(printf '%s\n' "$CERT_INFO" | grep -E "SHA1:|SHA-1:" | head -n 1 | sed -E 's/.*SHA-?1:[[:space:]]*//' | tr -d '[:space:]' || true)"
          ACTIVE_SHA256="$(printf '%s\n' "$CERT_INFO" | grep -E "SHA256:|SHA-256:" | head -n 1 | sed -E 's/.*SHA-?256:[[:space:]]*//' | tr -d '[:space:]' || true)"
          echo "  SHA1:   ${ACTIVE_SHA1:-unknown}"
          echo "  SHA256: ${ACTIVE_SHA256:-unknown}"
          echo "ACTIVE_APK_SHA1=${ACTIVE_APK_SHA1:-$ACTIVE_SHA1}" >> "$GITHUB_ENV"
          echo "ACTIVE_APK_SHA256=${ACTIVE_APK_SHA256:-$ACTIVE_SHA256}" >> "$GITHUB_ENV"

          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi
          if [ -f gradlew ]; then
            chmod +x gradlew
          fi

      - name: Restore Firebase google-services.json & BuildConfig secrets
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_GCM_SENDER_ID: ${{ secrets.FIREBASE_GCM_SENDER_ID }}
          FIREBASE_WEB_CLIENT_ID: ${{ secrets.FIREBASE_WEB_CLIENT_ID }}
        run: |
          FIREBASE_STATUS="MISSING"
          EXPECTED_PKG="com.aistudio.microrc.k7m9xp"

          if [ ! -s app/google-services.json ] && [ -n "${GOOGLE_SERVICES_JSON:-}" ]; then
            python3 - <<'PYEOF' || rm -f app/google-services.json
          import base64, json, os, re
          try:
              raw = os.environ.get("GOOGLE_SERVICES_JSON", "").strip()
              raw = re.sub(r"^```(?:json)?\s*", "", raw)
              raw = re.sub(r"\s*```$", "", raw).strip()
              if (raw.startswith('"') and raw.endswith('"')) or (raw.startswith("'") and raw.endswith("'")):
                  raw = raw[1:-1].strip()
              if raw.startswith("{"):
                  parsed = json.loads(raw)
              else:
                  decoded = base64.b64decode("".join(raw.split())).decode("utf-8")
                  parsed = json.loads(decoded)
              with open("app/google-services.json", "w", encoding="utf-8") as f:
                  json.dump(parsed, f, indent=2)
          except Exception as exc:
              print(f"::warning::Could not parse GOOGLE_SERVICES_JSON secret ({exc}); falling back to runtime/env config.")
          PYEOF
          elif [ ! -s app/google-services.json ] && [ -n "${GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | tr -d '[:space:]' | base64 -d > app/google-services.json 2>/dev/null || rm -f app/google-services.json
          fi

          # Validate JSON & verify package_name matches applicationId (or extract to GITHUB_ENV fallback)
          if [ -s app/google-services.json ]; then
            GS_CHECK="$(python3 - <<'PYEOF'
          import json, os
          expected_pkg = "com.aistudio.microrc.k7m9xp"
          try:
              with open("app/google-services.json", "r", encoding="utf-8") as f:
                  root = json.load(f)
              clients = root.get("client") or []
              has_match = any(
                  (c.get("client_info") or {}).get("android_client_info", {}).get("package_name") == expected_pkg
                  for c in clients if isinstance(c, dict)
              )
              if has_match:
                  print("VALID_MATCH")
              elif clients:
                  c0 = clients[0]
                  pinfo = root.get("project_info") or {}
                  api_keys = c0.get("api_key") or []
                  api_key = next((k.get("current_key", "") for k in api_keys if isinstance(k, dict) and k.get("current_key")), "")
                  web_id = ""
                  for oauth in (c0.get("oauth_client") or []):
                      if isinstance(oauth, dict) and oauth.get("client_type") == 3 and oauth.get("client_id"):
                          web_id = oauth["client_id"]
                          break
                  if not web_id:
                      other = (((c0.get("services") or {}).get("appinvite_service") or {}).get("other_platform_oauth_client") or [])
                      for oauth in other:
                          if isinstance(oauth, dict) and oauth.get("client_type") == 3 and oauth.get("client_id"):
                              web_id = oauth["client_id"]
                              break
                  gh_env = os.environ.get("GITHUB_ENV", "")
                  if gh_env:
                      pairs = {
                          "FIREBASE_PROJECT_ID": pinfo.get("project_id", ""),
                          "FIREBASE_STORAGE_BUCKET": pinfo.get("storage_bucket", ""),
                          "FIREBASE_GCM_SENDER_ID": pinfo.get("project_number", ""),
                          "FIREBASE_APP_ID": (c0.get("client_info") or {}).get("mobilesdk_app_id", ""),
                          "FIREBASE_API_KEY": api_key,
                          "FIREBASE_WEB_CLIENT_ID": web_id,
                      }
                      with open(gh_env, "a", encoding="utf-8") as ef:
                          for k, v in pairs.items():
                              clean_v = str(v).strip().replace("\r", "").replace("\n", "")
                              if clean_v:
                                  ef.write(f"{k}={clean_v}\n")
                  os.remove("app/google-services.json")
                  print("EXTRACTED_PACKAGE_MISMATCH")
              else:
                  os.remove("app/google-services.json")
                  print("INVALID")
          except Exception as exc:
              try:
                  os.remove("app/google-services.json")
              except OSError:
                  pass
              print(f"INVALID:{exc}")
          PYEOF
            )"
            case "$GS_CHECK" in
              VALID_MATCH)
                FIREBASE_STATUS="GOOGLE_SERVICES_JSON_OK"
                echo "Verified valid app/google-services.json for ${EXPECTED_PKG}."
                ;;
              EXTRACTED_PACKAGE_MISMATCH)
                FIREBASE_STATUS="EXTRACTED_TO_BUILDCONFIG"
                echo "::warning::google-services.json did not contain package ${EXPECTED_PKG}; extracted Firebase credentials into CI BuildConfig fallback so the APK still builds cleanly."
                ;;
              *)
                rm -f app/google-services.json
                echo "::warning::Invalid google-services.json (${GS_CHECK}); removed so APK build can proceed."
                ;;
            esac
          fi

          # Export optional FIREBASE_* secrets to GITHUB_ENV (single-line sanitized)
          for key in FIREBASE_PROJECT_ID FIREBASE_APP_ID FIREBASE_API_KEY FIREBASE_STORAGE_BUCKET FIREBASE_GCM_SENDER_ID FIREBASE_WEB_CLIENT_ID; do
            val="$(printf '%s' "${!key:-}" | tr -d '\r\n')"
            if [ -n "$val" ]; then
              printf '%s=%s\n' "$key" "$val" >> "$GITHUB_ENV"
            fi
          done

          if [ "$FIREBASE_STATUS" = "MISSING" ] && [ -n "${FIREBASE_PROJECT_ID:-}" ] && [ -n "${FIREBASE_APP_ID:-}" ] && [ -n "${FIREBASE_API_KEY:-}" ]; then
            FIREBASE_STATUS="ENV_BUILDCONFIG"
            echo "Configured Firebase fallback via FIREBASE_* secrets in GITHUB_ENV."
          elif [ "$FIREBASE_STATUS" = "MISSING" ]; then
            echo "::warning::app/google-services.json was not found! Add repository secret GOOGLE_SERVICES_JSON (or paste google-services.json once inside MicroRC -> Online Web Play) to enable Google Sign-In."
          fi

          SHA_MATCH_NOTE="N/A (no google-services.json)"
          if [ -s app/google-services.json ]; then
            EXPECTED_HASH="$(printf '%s' "${ACTIVE_APK_SHA1:-}" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
            if [ -n "$EXPECTED_HASH" ] && grep -qi "$EXPECTED_HASH" app/google-services.json; then
              SHA_MATCH_NOTE="Matched in google-services.json"
              echo "Verified APK SHA-1 (${ACTIVE_APK_SHA1}) is registered in app/google-services.json."
            else
              SHA_MATCH_NOTE="Add SHA-1 ${ACTIVE_APK_SHA1} in Firebase Console -> Project Settings (or set secret SIGNING_KEYSTORE_BASE64)"
              echo "::warning::Active APK SHA-1 (${ACTIVE_APK_SHA1}) is not listed in app/google-services.json. Register SHA-1 ${ACTIVE_APK_SHA1} (and SHA-256 ${ACTIVE_APK_SHA256}) in Firebase Console or set SIGNING_KEYSTORE_BASE64."
            fi
          fi

          {
            echo "### Firebase & Online Play Build Check"
            echo "- **Firebase Config**: \`${FIREBASE_STATUS}\`"
            echo "- **APK Signing SHA-1**: \`${ACTIVE_APK_SHA1:-unknown}\`"
            echo "- **APK Signing SHA-256**: \`${ACTIVE_APK_SHA256:-unknown}\`"
            echo "- **Google Sign-In Cert Match**: ${SHA_MATCH_NOTE}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Configure CI build version
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          echo "CI_VERSION_CODE=$((RUN_NUMBER + 100))" >> "$GITHUB_ENV"
          echo "CI_VERSION_NAME=1.0.${RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Build installable debug APK
        run: |
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk MicroRC.apk

      - name: Run unit and Robolectric tests
        run: gradle testDebugUnitTest --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MicroRC-apk
          path: MicroRC.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release APK
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: MicroRC-apk

      - name: Create GitHub Release with APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v1.0.${GITHUB_RUN_NUMBER}"
          fi
          NOTES="Automated MicroRC APK build from commit ${GITHUB_SHA::7} (${GITHUB_REF_NAME}). Signed with persistent repository key for direct Obtainium updates."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" MicroRC.apk --clobber
          else
            gh release create "$TAG" MicroRC.apk \
              --title "MicroRC ${TAG}" \
              --notes "$NOTES" \
              --target "$GITHUB_SHA" \
              --latest
          fi
