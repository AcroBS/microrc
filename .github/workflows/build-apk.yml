name: Build Android APK

on:
  push:
    branches-ignore:
      - ci-keystore
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build & Test Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK licenses & install SDK 36.1
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER=""
          for candidate in \
            "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK_ROOT/cmdline-tools/bin/sdkmanager" \
            "$(command -v sdkmanager 2>/dev/null || true)"; do
            if [ -n "$candidate" ] && [ -x "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi
          done
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-36.1" "build-tools;36.0.0" "platform-tools" || \
              "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-36" "build-tools;36.0.0" "platform-tools" || true
          fi

      - name: Prepare persistent APK signing keystore and environment
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          rm -f debug.keystore

          # 1. Prefer user-configured GitHub Actions secret SIGNING_KEYSTORE_BASE64 if provided
          if [ -n "${SIGNING_KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$SIGNING_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > debug.keystore || rm -f debug.keystore
          fi

          # 2. Otherwise use debug.keystore.base64 if present in the repository
          if [ ! -s debug.keystore ] && [ -s debug.keystore.base64 ]; then
            tr -d '[:space:]' < debug.keystore.base64 | base64 -d > debug.keystore || rm -f debug.keystore
          fi

          # 3. Otherwise restore the persistent CI keystore from orphan branch 'ci-keystore'
          #    (AI Studio does not export debug.keystore* to GitHub; persisting it once on
          #    'ci-keystore' guarantees every release is signed with the exact same certificate
          #    so Obtainium / Android direct in-place updates succeed without uninstalling.)
          if [ ! -s debug.keystore ]; then
            if git fetch --depth=1 origin refs/heads/ci-keystore:refs/remotes/origin/ci-keystore 2>/dev/null; then
              git show refs/remotes/origin/ci-keystore:debug.keystore.base64 | tr -d '[:space:]' | base64 -d > debug.keystore || rm -f debug.keystore
            fi
          fi

          # 4. Very first CI run fallback: generate once and persist to 'ci-keystore' branch
          if [ ! -s debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            if [ "${GITHUB_EVENT_NAME:-}" != "pull_request" ] && [ -n "${GH_TOKEN:-}" ]; then
              TMP_KS_DIR="$(mktemp -d)"
              base64 -w 0 debug.keystore > "$TMP_KS_DIR/debug.keystore.base64"
              (
                cd "$TMP_KS_DIR"
                git init -q
                git config user.name "github-actions[bot]"
                git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                git add debug.keystore.base64
                git commit -q -m "chore: persist CI APK signing keystore"
                git push -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/ci-keystore || true
              )
              rm -rf "$TMP_KS_DIR"
            fi
          fi

          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi
          if [ -f gradlew ]; then
            chmod +x gradlew
          fi

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Build installable debug APK
        env:
          CI_VERSION_CODE: ${{ github.run_number + 10 }}
          CI_VERSION_NAME: "1.0.${{ github.run_number }}"
        run: |
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk MicroRC.apk

      - name: Run unit and Robolectric tests
        run: gradle testDebugUnitTest --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MicroRC-apk
          path: MicroRC.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release APK
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: MicroRC-apk

      - name: Create GitHub Release with APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v1.0.${GITHUB_RUN_NUMBER}"
          fi
          NOTES="Automated MicroRC APK build from commit ${GITHUB_SHA::7} (${GITHUB_REF_NAME}). Signed with persistent repository key for direct Obtainium updates."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" MicroRC.apk --clobber
          else
            gh release create "$TAG" MicroRC.apk \
              --title "MicroRC ${TAG}" \
              --notes "$NOTES" \
              --target "$GITHUB_SHA" \
              --latest
          fi
